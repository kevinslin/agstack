version: 1.0
output:
  file_extension: md
variables:
  flow:
    values: ["*"]
    description: Concise kebab-case flow name.
  cook:
    values: ["*"]
    description: Kebab-case cookbook slug.
  report:
    values: ["*"]
    description: Kebab-case report slug for findings the user explicitly promotes into a project report.
  raw:
    values: ["*"]
    description: Kebab-case raw finding slug for initial project evidence.
schema:
  design:
    description: Current project design, ownership boundaries, decisions, constraints, and open questions.
    template: design
    insertion_policy:
      use_when:
        - The note describes the current project model, scope, ownership, invariants, accepted decisions, constraints, or open questions.
        - The content should guide future project work at the root rather than inside one numbered spec.
      avoid_when:
        - The content is recent execution status; put it in progress.
        - The content is an evidence-backed lesson from agent work; put it in learnings.
        - The content is an explicit user instruction or correction; put it in steering.
  progress:
    description: Project-level status, recent agent changes, current blockers, and next actions.
    template: progress
    insertion_policy:
      use_when:
        - The note records recent project changes, current status, blockers, completed work, active work, or next actions.
        - A replacement agent needs operational state before continuing project work.
      avoid_when:
        - The content is a durable design decision or ownership rule; put it in design.
        - The content is spec-local execution state; put it in the matching specs directory.
  learnings:
    description: Evidence-backed project lessons, reusable patterns, invalidated assumptions, and follow-up checks.
    template: learnings
    insertion_policy:
      use_when:
        - The note records a lesson backed by source, test output, user correction, or observed runtime behavior.
        - The lesson should help future agents avoid repeating project-specific mistakes.
      avoid_when:
        - The content is a direct user instruction; put it in steering.
        - The content is unsourced interpretation that has not been checked against evidence.
  steering:
    description: Explicit user instructions, corrections, preferences, and source pointers that govern project work.
    template: steering
    insertion_policy:
      use_when:
        - The note records user-authored instructions, corrections, accepted constraints, or durable preferences.
        - The source and date of the steering matter for future project decisions.
      avoid_when:
        - The content is an inferred lesson from agent work; put it in learnings.
        - The content is a design recommendation not explicitly accepted by the user.
  specs:
    description: Numbered project specs are maintained by the separate specs schema; keep this marker for project-root navigation.
    dynamic_child: true
  raw:
    description: Initial project findings, source snapshots, uncertainties, and analysis held before the user explicitly promotes these findings into a project report.
    children:
      "{{raw}}":
        description: Raw project finding with concise provenance, evidence, and uncertainty notes, used by default for findings and audits until the user explicitly promotes these findings into a project report.
        template: raw
        dynamic_child: true
        insertion_policy:
          use_when:
            - The note captures initial findings, rough analysis, source snapshots, unresolved evidence, or uncertainty that should remain reviewable without becoming a project report.
            - The user asks to save findings, audit results, or source-backed analysis without explicitly promoting those findings into a project report.
          avoid_when:
            - The user explicitly promotes these findings into a project report; put that curated result under reports/{{report}} and link back to the raw source.
            - The content is current project status, blockers, or next actions; put it in progress.
  flows:
    description: Canonical project-level flow docs for current behavior.
    children:
      "{{flow}}":
        description: Canonical project-level flow doc for a current behavior or execution path.
        template: flow-doc
        dynamic_child: true
        insertion_policy:
          use_when:
            - The flow describes current project-wide behavior or an execution path that is accepted as canonical.
            - The document should remain useful outside one numbered spec.
          avoid_when:
            - The flow is proposed, exploratory, snapshot evidence, or scoped to one numbered spec; put it under specs/{{spec_number}}-{{spec_slug}}/flows.
            - Promotion from a spec flow to a project flow has not been explicitly decided.
  cook:
    description: Project-level cookbooks and reusable recipes.
    children:
      "{{cook}}":
        description: Project-level cookbook or reusable recipe.
        template: cook
        dynamic_child: true
        insertion_policy:
          use_when:
            - The recipe is reusable across project work and not tied to one numbered spec.
          avoid_when:
            - The recipe is temporary or spec-local; put it under the matching specs directory.
  reports:
    description: Project reports created only when the user explicitly promotes raw findings into a project report.
    children:
      "{{report}}":
        description: Project report for findings the user explicitly promoted; include source raw records and do not create this from initial findings or audits by default.
        template: report
        dynamic_child: true
        insertion_policy:
          use_when:
            - The user explicitly promotes raw findings, audit results, or source-backed analysis into a project report.
            - The report curates source raw records into a durable project-root summary.
          avoid_when:
            - The work is still initial research, source capture, rough analysis, or uncertain findings; put it under raw/{{raw}}.
            - The report is specific to one numbered spec; put it under specs/{{spec_number}}-{{spec_slug}}/reports.
