version: 1.0
output:
  file_extension: md
variables:
  spec_number:
    values: ["*"]
    default: "1"
    description: Spec number, incrementing from 1.
  spec_slug:
    values: ["*"]
    default: bootstrap
    description: Kebab-case spec slug.
  artifact:
    values: ["*"]
    description: Kebab-case artifact slug.
  flow:
    values: ["*"]
    description: Concise kebab-case flow name.
  cook:
    values: ["*"]
    description: Kebab-case cookbook slug.
  subspec:
    values: ["*"]
    default: "1.1"
    description: Milestone subspec number, using 1.N numbering.
  subspec_slug:
    values: ["*"]
    description: Kebab-case milestone slug.
  report:
    values: ["*"]
    description: Kebab-case report slug.
  proof:
    values: ["*"]
    default: proof
    description: Integration proof slug.
  scenario:
    values: ["*"]
    description: Integration proof scenario slug.
schema:
  specs:
    description: Active numbered specs plus a root archive for completed or superseded spec units.
    children:
      ".archive":
        description: Completed or superseded spec units, including terminal milestone subspecs, moved here without renaming.
        dynamic_child: true
      "{{spec_number}}-{{spec_slug}}":
        description: One active numbered spec directory.
        dynamic_child: true
        children:
          spec:
            description: Main spec for this numbered unit, including goals, requirements, plan, validation, and open questions.
            template: spec
            insertion_policy:
              use_when:
                - The document is the primary implementation, investigation, or design spec for this numbered unit.
                - The content defines the spec goal, requirements, plan, validation, and accepted scope.
              avoid_when:
                - The content is only current execution state; put it in progress or handoff.
                - The content is a supporting runbook, report, or proof artifact.
          handoff:
            description: Current resumption context, completed work, next action, blockers, and relevant files for this spec.
            template: handoff
            insertion_policy:
              use_when:
                - A replacement agent needs the latest spec-local state to resume work.
                - The note should be overwritten or refreshed as current handoff context changes.
              avoid_when:
                - The content is a durable project-wide decision; put it in project design or steering.
          progress:
            description: Spec-local implementation status, completed work, active work, next steps, and blockers.
            template: progress
            insertion_policy:
              use_when:
                - The note tracks progress for this numbered spec rather than the whole project.
              avoid_when:
                - The content is project-level status; put it in project progress.
          learnings:
            description: Durable takeaways discovered while executing this numbered spec.
            template: learnings
            insertion_policy:
              use_when:
                - The note records evidence-backed lessons discovered during this spec.
                - The lesson should travel with the spec when the whole unit is archived.
              avoid_when:
                - The content is an explicit user instruction that governs the whole project.
          artifacts:
            description: Durable supporting artifacts attached to this spec, including operator runbooks, handoff instructions, and other concrete deliverables.
            children:
              "{{artifact}}":
                description: One durable supporting artifact for this spec.
                template: artifact
                dynamic_child: true
                insertion_policy:
                  use_when:
                    - The file is a concrete deliverable, operator runbook, command sequence, or handoff artifact referenced by the spec.
                    - The content should remain independently usable without expanding the main spec.
                  avoid_when:
                    - The document is the main feature spec, a milestone plan, or a behavior flow explanation.
                    - The content is raw integration evidence; put that under proofs instead.
          flows:
            description: Spec-local flow docs for proposed behavior, exploration, snapshots, or behavior that has not been promoted to canonical project flow.
            children:
              "{{flow}}":
                description: Spec-local flow doc for a proposed, exploratory, snapshot, or unpromoted behavior path.
                template: flow-doc
                dynamic_child: true
                insertion_policy:
                  use_when:
                    - The document explains proposed, exploratory, snapshot, or spec-scoped behavior.
                    - The flow name is concise kebab-case and names the feature or behavior rather than the implementation class.
                  avoid_when:
                    - The document is the main feature spec, milestone plan, or current canonical project behavior.
                    - The flow has already been accepted as maintained project-wide behavior; put it in project flows.
                    - The content is a raw integration artifact or proof summary.
          cook:
            description: Cookbooks and reusable recipes for this spec.
            children:
              "{{cook}}":
                description: Cookbook or reusable recipe for a recurring spec task.
                template: cook
                dynamic_child: true
                insertion_policy:
                  use_when:
                    - The document captures a repeatable recipe or workflow that can be reused across runs.
                    - The content includes inputs, commands, decision points, and expected outputs for a recurring task.
                  avoid_when:
                    - The document is a one-off report, raw proof artifact, or main feature spec.
          milestones:
            description: Optional milestone subspecs, numbered as 1.N where N increments from 1.
            children:
              "{{subspec}}-{{subspec_slug}}":
                description: Milestone subspec document.
                template: milestone
                dynamic_child: true
          proofs:
            description: Integration behavior proofs for this spec.
            children_from:
              - schema: integ-proof
                vars:
                  proof: "{{proof}}"
                  scenario: "{{scenario}}"
          reports:
            description: Optional custom reports relevant to this spec.
            children:
              "{{report}}":
                description: Custom report relevant to this spec.
                template: report
                dynamic_child: true
