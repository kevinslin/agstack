version: 1.0
output:
  file_extension: md
variables:
  package:
    values: ["*"]
    description: Package slug below the configured schema mount.
  cook: ["*"]
  reference: ["*"]
  topic: ["*"]
  flow: ["*"]
  arch: ["*"]
  num: ["*"]
  slug: ["*"]
  api_name: ["*"]
  name: ["*"]
  spec_number: ["*"]
  spec_slug: ["*"]
  artifact: ["*"]
  subspec: ["*"]
  subspec_slug: ["*"]
  report: ["*"]
  proof: ["*"]
  scenario: ["*"]
schema:
  "{{package}}":
    description: One package knowledge boundary containing reusable guides, code documentation, and package specs.
    dynamic_child: true
    children_from:
      - schema: global-core
        vars:
          cook: "{{cook}}"
          reference: "{{reference}}"
          topic: "{{topic}}"
      - schema: code-core
        vars:
          flow: "{{flow}}"
          arch: "{{arch}}"
          num: "{{num}}"
          slug: "{{slug}}"
          api_name: "{{api_name}}"
          name: "{{name}}"
      - schema: specs
        vars:
          spec_number: "{{spec_number}}"
          spec_slug: "{{spec_slug}}"
          artifact: "{{artifact}}"
          flow: "{{flow}}"
          cook: "{{cook}}"
          subspec: "{{subspec}}"
          subspec_slug: "{{subspec_slug}}"
          report: "{{report}}"
          proof: "{{proof}}"
          scenario: "{{scenario}}"
